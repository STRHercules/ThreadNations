[package]
name = "threadnations-app"
default-run = "bevy_client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d", "png"] }
bevy_egui = { version = "0.41", default-features = false, features = ["default_fonts", "render"] }
threadnations-analysis = { path = "../analysis" }
threadnations-common = { path = "../common" }
threadnations-simulation = { path = "../simulation" }
threadnations-worldgen = { path = "../worldgen" }
threadnations-persistence = { path = "../persistence" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[lints]
workspace = true
