[workspace]
members = [
    "crates/common",
    "crates/analysis",
    "crates/worldgen",
    "crates/simulation",
    "crates/app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/STRHercules/ThreadNations"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
